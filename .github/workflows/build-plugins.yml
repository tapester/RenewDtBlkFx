name: Build DtBlkFx plugins

on:
  # Validate changes to the default branch, proposed PRs, and manually dispatched runs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # The workflow only needs to read the checked-out source.
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep one native build per supported CI platform so a failure does not cancel its peer.
      matrix:
        include:
          - name: windows
            os: windows-latest
            triplet: x64-windows
            generator: "Visual Studio 17 2022"
            cmake_extra: ""
          - name: macos
            os: macos-latest
            triplet: arm64-osx
            generator: "Ninja"
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # JUCE, vcpkg, and CLAP JUCE Extensions are required submodules.
          submodules: recursive

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap repo-local vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # vcpkg.exe is generated by bootstrap and is not part of a fresh submodule checkout.
          $root = Join-Path $env:GITHUB_WORKSPACE "modules\vcpkg"
          & (Join-Path $root "bootstrap-vcpkg.bat")
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path (Join-Path $root "vcpkg.exe"))) {
            throw "vcpkg bootstrap completed without creating vcpkg.exe at $root"
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Persist vcpkg's root and executable path for the remaining job steps.
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using bootstrapped repo-local vcpkg: $root"

      - name: Install FFTW3 via repo-local vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\modules\vcpkg\vcpkg.exe" install fftw3:x64-windows

      - name: Bootstrap vcpkg (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Build the repo-pinned vcpkg executable and expose it to later steps.
          root="$GITHUB_WORKSPACE/modules/vcpkg"
          "$root/bootstrap-vcpkg.sh"
          if [[ ! -x "$root/vcpkg" ]]; then
            echo "vcpkg bootstrap completed without creating $root/vcpkg" >&2
            exit 1
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root" >> "$GITHUB_PATH"

      - name: Install FFTW3 via repo-local vcpkg (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./modules/vcpkg/vcpkg install fftw3:arm64-osx

      - name: Configure CMake
        shell: bash
        run: |
          # The manifest declares FFTW3; the repo-local toolchain resolves it for this triplet.
          cmake -S . -B build \
            -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/modules/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            ${{ matrix.cmake_extra }}

      - name: Build plugin bundles
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Run engine tests
        shell: bash
        run: |
          # Fail CI on DSP or scheduler regressions before publishing plugin bundles.
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect VST3 artifacts
        shell: bash
        run: |
          # VST3 products are package directories, so copy each bundle as a directory.
          mkdir -p artifacts/vst3
          find build -type d -iname "*.vst3" -exec cp -R {} artifacts/vst3/ \;
          find artifacts/vst3 -maxdepth 2 -print

      - name: Collect CLAP artifacts
        shell: bash
        run: |
          # CLAP outputs may be files or bundles depending on the target platform.
          mkdir -p artifacts/clap
          find build -iname "*.clap" -exec cp -R {} artifacts/clap/ \;
          find artifacts/clap -maxdepth 2 -print

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DtBlkFx-${{ matrix.name }}-VST3
          path: artifacts/vst3/**
          if-no-files-found: error

      - name: Upload CLAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DtBlkFx-${{ matrix.name }}-CLAP
          path: artifacts/clap/**
          if-no-files-found: error

      # Pin the validator binary to the latest stable release instead of a moving action ref.
      - name: Download pluginval 1.0.4 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "pluginval.zip"
          $destination = Join-Path $env:RUNNER_TEMP "pluginval"
          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $executable = Get-ChildItem -Path $destination -Filter "pluginval.exe" -Recurse |
            Select-Object -First 1
          if ($null -eq $executable) {
            throw "pluginval.exe was not found in the v1.0.4 release archive"
          }
          $executable.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download pluginval 1.0.4 (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/pluginval.zip"
          destination="$RUNNER_TEMP/pluginval"
          mkdir -p "$destination"
          curl -fL "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip" -o "$archive"
          unzip -q "$archive" -d "$destination"
          executable="$(find "$destination" -type f -path '*/Contents/MacOS/pluginval' -print -quit)"
          if [[ -z "$executable" ]]; then
            echo "pluginval executable was not found in the v1.0.4 release archive" >&2
            exit 1
          fi
          chmod +x "$executable"
          dirname "$executable" >> "$GITHUB_PATH"

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Skip GUI checks because GitHub-hosted runners do not provide an interactive desktop.
          pluginval.exe --strictness-level 5 --skip-gui-tests "build/DtBlkFx_artefacts/Release/VST3/DtBlkFx.vst3"

      - name: Validate VST3 (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pluginval --strictness-level 5 --skip-gui-tests "build/DtBlkFx_artefacts/Release/VST3/DtBlkFx.vst3"
