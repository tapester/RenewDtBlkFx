name: Build DtBlkFx plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            triplet: x64-windows
            generator: "Visual Studio 17 2022"
            cmake_extra: ""
          - name: macos
            os: macos-latest
            triplet: arm64-osx
            generator: "Ninja"
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set repo-local vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "modules\vcpkg"
          if (-not (Test-Path (Join-Path $root "vcpkg.exe"))) {
            throw "Repo-local vcpkg.exe not found at $root"
          }
          $env:VCPKG_ROOT = $root
          $env:PATH = "$root;$env:PATH"
          Write-Host "Using repo-local vcpkg: $root"

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap repo-local vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\modules\vcpkg\bootstrap-vcpkg.bat"

      - name: Install FFTW3 via repo-local vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\modules\vcpkg\vcpkg.exe" install fftw3:x64-windows

      - name: Bootstrap vcpkg (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./modules/vcpkg/bootstrap-vcpkg.sh

      - name: Install FFTW3 via repo-local vcpkg (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./modules/vcpkg/vcpkg install fftw3:arm64-osx

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/modules/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            ${{ matrix.cmake_extra }}

      - name: Build plugin bundles
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Run engine tests
        shell: bash
        run: |
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect VST3 artifacts
        shell: bash
        run: |
          mkdir -p artifacts/vst3
          find build -type d -iname "*.vst3" -exec cp -R {} artifacts/vst3/ \;
          find artifacts/vst3 -maxdepth 2 -print

      - name: Collect CLAP artifacts
        shell: bash
        run: |
          mkdir -p artifacts/clap
          find build -type d -iname "*.clap" -exec cp -R {} artifacts/clap/ \;
          find artifacts/clap -maxdepth 2 -print

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DtBlkFx-${{ matrix.name }}-VST3
          path: artifacts/vst3/**
          if-no-files-found: error

      - name: Upload CLAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DtBlkFx-${{ matrix.name }}-CLAP
          path: artifacts/clap/**
          if-no-files-found: error
      - name: Validate VST3
        uses: Tracktion/pluginval/validate@v2
        with:
          plugins: |
            build/DtBlkFx_artefacts/Release/VST3/DtBlkFx.vst3
          strictness-level: 5
          args: --skip-gui-tests