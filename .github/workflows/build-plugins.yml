name: Build DtBlkFx plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # CI uses the same Ninja presets as local release/test builds on every platform.
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            preset: windows-x64-tests
            build_dir: build/windows-x64-tests
          - name: macos-arm64
            os: macos-latest
            preset: macos-arm64-tests
            build_dir: build/macos-arm64-tests
          - name: macos-x64
            os: macos-latest
            preset: macos-x64-tests
            build_dir: build/macos-x64-tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap repo-local vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "modules\vcpkg"
          & (Join-Path $root "bootstrap-vcpkg.bat")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $root "vcpkg.exe"))) {
            throw "vcpkg bootstrap completed without creating vcpkg.exe at $root"
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bootstrap vcpkg (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/modules/vcpkg"
          "$root/bootstrap-vcpkg.sh"
          if [[ ! -x "$root/vcpkg" ]]; then
            echo "vcpkg bootstrap completed without creating $root/vcpkg" >&2
            exit 1
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root" >> "$GITHUB_PATH"

      - name: Configure CMake
        # vcpkg manifest mode (vcpkg.json) installs FFTW3 for the preset's triplet during configure.
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build plugin bundles
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Run tests
        run: ctest --preset "${{ matrix.preset }}"

      - name: Verify plugin has no FFTW runtime dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "${{ matrix.build_dir }}/DtBlkFx_artefacts/Release/VST3/DtBlkFx.vst3"
          $binary = Join-Path $bundle "Contents/x86_64-win/DtBlkFx.vst3"
          if (-not (Test-Path $binary)) { throw "Plugin binary not found: $binary" }
          $dependents = dumpbin /dependents $binary | Out-String
          Write-Host $dependents
          if ($dependents -match "(?i)fftw") {
            throw "Plugin still imports an FFTW DLL. Use the x64-windows-static-md triplet."
          }
          $strayDll = Get-ChildItem -Path $bundle -Recurse -Filter "fftw*.dll" -ErrorAction SilentlyContinue
          if ($strayDll) { throw "Unexpected FFTW DLL inside the VST3 bundle: $($strayDll.FullName)" }

      - name: Collect VST3 artifacts
        shell: bash
        run: |
          mkdir -p artifacts/vst3
          find "${{ matrix.build_dir }}" -type d -iname "*.vst3" -exec cp -R {} artifacts/vst3/ \;
          find artifacts/vst3 -maxdepth 3 -print

      - name: Collect CLAP artifacts
        shell: bash
        run: |
          mkdir -p artifacts/clap
          find "${{ matrix.build_dir }}" -iname "*.clap" -exec cp -R {} artifacts/clap/ \;
          find artifacts/clap -maxdepth 3 -print

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenewDtBlkFx-${{ matrix.name }}-VST3
          path: artifacts/vst3/**
          if-no-files-found: error

      - name: Upload CLAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenewDtBlkFx-${{ matrix.name }}-CLAP
          path: artifacts/clap/**
          if-no-files-found: error

      - name: Download pluginval 1.0.4 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "pluginval.zip"
          $destination = Join-Path $env:RUNNER_TEMP "pluginval"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $executable = Get-ChildItem -Path $destination -Filter "pluginval.exe" -Recurse | Select-Object -First 1
          if ($null -eq $executable) { throw "pluginval.exe was not found in the v1.0.4 release archive" }
          $executable.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download pluginval 1.0.4 (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/pluginval.zip"
          destination="$RUNNER_TEMP/pluginval"
          mkdir -p "$destination"
          curl -fL "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip" -o "$archive"
          unzip -q "$archive" -d "$destination"
          executable="$(find "$destination" -type f -path '*/Contents/MacOS/pluginval' -print -quit)"
          if [[ -z "$executable" ]]; then
            echo "pluginval executable was not found in the v1.0.4 release archive" >&2
            exit 1
          fi
          chmod +x "$executable"
          dirname "$executable" >> "$GITHUB_PATH"

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pluginval.exe --strictness-level 5 --skip-gui-tests "${{ matrix.build_dir }}/DtBlkFx_artefacts/Release/VST3/DtBlkFx.vst3"

      - name: Validate VST3 (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pluginval --strictness-level 5 --skip-gui-tests "${{ matrix.build_dir }}/DtBlkFx_artefacts/Release/VST3/DtBlkFx.vst3"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Checkout clap-validator
        uses: actions/checkout@v4
        with:
          repository: free-audio/clap-validator
          path: tools/clap-validator

      - name: Build clap-validator
        shell: bash
        run: |
          cd tools/clap-validator
          cargo build --release

      - name: Validate CLAP with clap-validator
        shell: bash
        run: |
          clap="$(find artifacts/clap -iname '*.clap' -print -quit)"
          if [[ -z "$clap" ]]; then
            echo "No CLAP artifact found" >&2
            exit 1
          fi
          tools/clap-validator/target/release/clap-validator validate --only-failed "$clap"
